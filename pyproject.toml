[project]
name = "accessory-validator"
version = "0.2.0"
description = "Validate whether accessories are eligible for leasing."
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==0.25.0",
    "pytest-mypy==1.0.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "app/tests",
    "tests",
]
